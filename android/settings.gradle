rootProject.name = 'PlasticsHub'
apply from: file("../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesSettingsGradle(settings)
include ':react-native-push-notification'
project(':react-native-push-notification').projectDir = file('../node_modules/react-native-push-notification/android')

include ':react-native-view-shot'
project(':react-native-view-shot').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-view-shot/android')

include ':react-native-audio-jack'
project(':react-native-audio-jack').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-audio-jack/android')

include ':react-native-app-auth'
project(':react-native-app-auth').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-app-auth/android')

include ':react-native-fs'
project(':react-native-fs').projectDir = new File(settingsDir, '../node_modules/react-native-fs/android')

include ':react-native-view-pdf'
project(':react-native-view-pdf').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-view-pdf/android')

include ':react-native-date-picker'
project(':react-native-date-picker').projectDir = new File(
        rootProject.projectDir,
        '../node_modules/react-native-date-picker/android'
)

include ':app'
includeBuild('../node_modules/react-native-gradle-plugin')
